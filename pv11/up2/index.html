<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090f1c">
<title>Money Club — AI Multiplier</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--bg:#0b111e;--panel:#192231;--border:#2a3546;--muted:#9aafc8;--blue:#4389f5;--cyan:#08b8ce;--purple:#a34df4;--violet:#5141e9}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:#fff}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 48%,#111a2a 0%,#0b111e 62%,#070c15 100%);display:flex;align-items:center;justify-content:center;padding:28px 18px}
#app{width:100%;min-height:calc(100vh - 56px);display:flex;align-items:center;justify-content:center}
.quiz{width:min(100%,430px);margin:auto}
.meta{display:flex;justify-content:space-between;align-items:center;color:#a5b6ca;font-size:12px;margin:0 0 10px}
.progress{height:7px;border-radius:99px;background:#202b3b;overflow:hidden;margin-bottom:28px}
.progress-fill{height:100%;background:linear-gradient(90deg,#5596ff,#08b8ce);border-radius:99px;transition:width .35s ease}
h1{font-size:21px;line-height:1.3;font-weight:800;text-align:center;margin:0 auto 26px;max-width:390px;letter-spacing:-.35px}
.options{display:flex;flex-direction:column;gap:9px}
.option{width:100%;min-height:60px;border:1px solid #263244;border-radius:14px;background:rgba(26,36,51,.88);color:white;display:flex;align-items:center;gap:13px;padding:12px 13px;text-align:left;cursor:pointer;transition:border-color .18s,background .18s,transform .18s}
.option:hover{border-color:#4389f5;background:#1c2b40;transform:translateY(-1px)}
.option:focus-visible,.cta:focus-visible,.text-link:focus-visible{outline:2px solid #62a5ff;outline-offset:3px}
.icon{width:36px;height:36px;flex:0 0 36px;border-radius:11px;background:#1c2d47;color:#59a5ff;display:grid;place-items:center}
.icon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.option-copy{display:flex;flex-direction:column;gap:3px;min-width:0}
.option strong{font-size:12px;line-height:1.25;font-weight:800}
.option small{font-size:10px;line-height:1.35;color:#9aacc2}
.screen{width:min(100%,720px);text-align:center;margin:auto;animation:appear .3s ease both}
@keyframes appear{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.analysis{width:min(100%,680px);text-align:center}
.spinner{width:96px;height:96px;border:6px solid #1c3763;border-top-color:#579cff;border-right-color:#579cff;border-radius:50%;margin:0 auto 38px;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.analysis h2{font-size:36px;line-height:1.2;margin:0 0 16px;font-weight:800;letter-spacing:-.8px}
.analysis p,.complete p,.intro p,.offer-sub{font-size:23px;line-height:1.7;color:var(--muted);margin:0}
.success{width:120px;height:120px;border-radius:50%;background:linear-gradient(145deg,#28ca96,#08a879);display:grid;place-items:center;margin:0 auto 34px}
.success svg{width:58px;height:58px;stroke:#fff;fill:none;stroke-width:2.6}
.complete h2{font-size:44px;line-height:1.2;margin:0 0 28px;font-weight:800;letter-spacing:-1px}
.complete p{max-width:620px;margin:0 auto 48px}
.cta{width:100%;min-height:84px;border:0;border-radius:17px;background:linear-gradient(100deg,#3d80f4,#08b7cc);color:white;font-size:21px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:16px;margin:auto;transition:filter .2s}
.cta:hover{filter:brightness(1.1)}
.cta svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.intro{width:min(100%,672px);text-align:center}
.robot{width:96px;height:96px;border-radius:25px;background:linear-gradient(135deg,#a64cf1,#5141e9);display:grid;place-items:center;margin:0 auto 26px}
.robot svg{width:48px;height:48px;stroke:white;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.intro h2{font-size:42px;line-height:1.15;margin:0 0 24px;font-weight:800;letter-spacing:-.8px}
.intro p{margin:0 auto 48px;max-width:630px}
.feature-list{display:flex;flex-direction:column;gap:24px;margin:0 0 48px;text-align:left}
.feature{min-height:80px;border:1px solid #303849;border-radius:18px;background:rgba(27,35,49,.82);display:flex;align-items:center;gap:20px;padding:18px 24px;color:#d6e0ee;font-size:20px;line-height:1.4}
.feature svg{width:28px;height:28px;flex:0 0 28px;stroke:#c17bff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.purple{background:linear-gradient(100deg,#a94cf1,#4d40e8);min-height:84px;font-size:23px}
.offer{width:min(100%,672px);text-align:center}
.offer h2{font-size:36px;line-height:1.2;margin:0 0 14px;font-weight:800}
.offer-sub{font-size:21px;line-height:1.45;margin:0 auto 36px;max-width:600px}
.price-card{position:relative;border:2px solid #63348f;border-radius:24px;background:linear-gradient(145deg,rgba(31,22,54,.82),rgba(23,31,49,.92));padding:60px 36px 36px;margin:0 auto 34px;box-shadow:0 22px 55px rgba(112,51,179,.12)}
.price-tag{position:absolute;top:-17px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:11px 26px;border-radius:99px;background:linear-gradient(100deg,#a94cf1,#5141e9);font-size:16px;font-weight:800}
.unlock{font-size:20px;color:var(--muted);margin:0 0 6px}
.price{font-size:72px;font-weight:800;line-height:1.1;letter-spacing:-2px;margin:0}
.price .currency{font-size:19px;color:#9babc2;letter-spacing:0;margin-right:7px}
.payment{font-size:19px;color:#7187a4;margin:6px 0 36px}
.benefits{list-style:none;padding:0;margin:0 0 36px;text-align:left;display:flex;flex-direction:column;gap:18px}
.benefits li{display:flex;align-items:center;gap:13px;font-size:20px;color:#d9e1ee;line-height:1.35}
.benefits svg{width:23px;height:23px;flex:0 0 23px;stroke:#c17bff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.guarantee{color:#788da9;font-size:18px;margin:0 0 32px}
.text-link{background:none;border:0;padding:8px;color:#586d89;text-decoration:underline;font:inherit;font-size:18px;cursor:pointer;margin:0 auto 42px;display:block}
.secure{display:flex;justify-content:center;align-items:center;gap:13px;color:#526781;font-size:17px}
.secure svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8}
@media(max-width:600px){
 body{padding:22px 18px}#app{min-height:calc(100vh - 44px)}
 .quiz{max-width:430px}h1{font-size:22px;margin-bottom:25px}
 .option{min-height:66px}.option strong{font-size:12px}.option small{font-size:10px}
 .analysis h2{font-size:29px}.analysis p,.complete p{font-size:18px}
 .success{width:94px;height:94px;margin-bottom:28px}.complete h2{font-size:34px}.complete p{margin-bottom:34px}
 .cta{min-height:68px;font-size:17px}.intro h2{font-size:36px}.intro p{font-size:19px;margin-bottom:34px}
 .robot{width:82px;height:82px}.feature-list{gap:15px;margin-bottom:32px}.feature{min-height:72px;padding:15px 17px;font-size:16px;gap:15px}
 .purple{min-height:70px;font-size:19px}.offer h2{font-size:30px}.offer-sub{font-size:18px;margin-bottom:32px}
 .price-card{padding:52px 20px 24px;border-radius:20px}.price{font-size:62px}.payment{margin-bottom:28px}
 .benefits{gap:16px;margin-bottom:28px}.benefits li{font-size:16px}.guarantee,.text-link{font-size:15px}.secure{font-size:14px}
}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
(() => {
  const BUY_URL = "https://www.google.com/";
  const SKIP_URL = "https://www.google.com/";
  const questions = [
    {title:"What's your current financial situation?",options:[
      {icon:"alert",title:"STRUGGLING",desc:"I have debt or urgent money problems"},
      {icon:"wallet",title:"STABLE BUT LIMITED",desc:"I pay my bills but have little left over"},
      {icon:"trend",title:"COMFORTABLE",desc:"I have some savings and control of my finances"},
      {icon:"dollar",title:"VERY COMFORTABLE",desc:"I have a solid reserve and want to multiply my wealth"}]},
    {title:"How much do you want to earn per month?",options:[
      {icon:"dollar",title:"$5,000 - $10,000/MONTH"},
      {icon:"wallet",title:"$10,000 - $20,000/MONTH"},
      {icon:"star",title:"$20,000 - $35,000/MONTH"},
      {icon:"rocket",title:"OVER $35,000/MONTH"}]},
    {title:"In how long do you want to achieve this?",options:[
      {icon:"timer",title:"LESS THAN 6 MONTHS"},
      {icon:"calendar",title:"6–12 MONTHS"},
      {icon:"calendar",title:"1–2 YEARS"}]}
  ];
  const paths = {
    alert:'<path d="M10.3 3.9 2.6 17.2a1.7 1.7 0 0 0 1.5 2.5h15.8a1.7 1.7 0 0 0 1.5-2.5L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4m0 3h.01"/>',
    wallet:'<path d="M4 5.5h14a2 2 0 0 1 2 2v11H5a3 3 0 0 1-3-3V5a2 2 0 0 1 2-2h13"/><path d="M20 10h-5a2 2 0 0 0 0 4h5v-4Z"/>',
    trend:'<path d="m3 16 6-6 4 4 8-9"/><path d="M15 5h6v6"/>',
    dollar:'<path d="M12 2v20m5-16H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
    star:'<path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3Z"/>',
    rocket:'<path d="M5 14c-2 1.5-2.5 5-2.5 5s3.5-.5 5-2.5"/><path d="M9 15 6 12c1-4 5-8 13-9 0 8-5 12-9 13l-1-1Z"/><circle cx="14.5" cy="8.5" r="1.5"/>',
    timer:'<circle cx="12" cy="13" r="8"/><path d="M12 13 16 10M9 2h6m-3 0v3"/>',
    calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>'
  };
  const svg = (body,view="0 0 24 24") => `<svg viewBox="${view}" aria-hidden="true">${body}</svg>`;
  const app = document.getElementById("app");
  const answers = [];
  let step = 0;
  const clickSound = new Audio("https://growaiclub.com/audios/touchsound.mp3");
  clickSound.preload = "auto";
  function playClickSound(){
    try { clickSound.currentTime = 0; const playback = clickSound.play(); if (playback && playback.catch) playback.catch(() => {}); } catch (_) {}
  }
  const icon = name => `<span class="icon" aria-hidden="true">${svg(paths[name]||paths.star)}</span>`;
  const arrow = svg('<path d="M5 12h14m-7-7 7 7-7 7"/>');
  const check = svg('<circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/>');
  function renderQuestion(){
    const q=questions[step],pct=Math.round((step+1)/questions.length*100);
    app.innerHTML=`<section class="quiz screen">
      <div class="meta"><span>Question ${step+1} of 3</span><span>${pct}%</span></div>
      <div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div>
      <h1>${q.title}</h1><div class="options">${q.options.map((o,i)=>`<button class="option" type="button" data-choice="${i}">${icon(o.icon)}<span class="option-copy"><strong>${o.title}</strong>${o.desc?`<small>${o.desc}</small>`:""}</span></button>`).join("")}</div>
    </section>`;
    app.querySelectorAll(".option").forEach(b=>b.addEventListener("click",()=>{
      playClickSound();
      answers[step]=Number(b.dataset.choice);step++;
      if(step<questions.length)renderQuestion();else showAnalysis();
    }));
  }
  function showAnalysis(){
    app.innerHTML=`<section class="screen analysis"><div class="spinner"></div><h2>Analyzing your profile...</h2><p>This will take just a moment</p></section>`;
    setTimeout(showComplete,2400);
  }
  function showComplete(){
    app.innerHTML=`<section class="screen complete"><div class="success">${svg('<circle cx="32" cy="32" r="26"/><path d="m20 32 8 8 17-18"/>','0 0 64 64')}</div>
      <h2>Your profile is ready!</h2><p>Based on your answers, we identified the perfect solution to accelerate your results.</p>
      <button class="cta" id="see-result">SEE MY RESULT ${arrow}</button></section>`;
    document.getElementById("see-result").addEventListener("click",()=>{playClickSound();showIntro();});
  }
  function showIntro(){
    const features=[
      ['<path d="m13 2-3 8h7l-6 12 1-9H5l8-11Z"/>','Automatically reinvests your daily profits'],
      ['<path d="m3 16 6-6 4 4 8-9"/><path d="M15 5h6v6"/>','Uses compound interest to multiply your earnings'],
      ['<path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/>','AI-powered risk management protects your balance'],
      ['<path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/><path d="m19 14 1.2 3.3L23 18l-2.8 1-1.2 3-1.1-3-2.9-1 2.9-.7L19 14Z"/>','Works 24/7 while you sleep']
    ];
    app.innerHTML=`<section class="screen intro">
      <div class="robot">${svg('<rect x="4" y="7" width="16" height="13" rx="3"/><path d="M9 7V4h6v3M2 13h2m16 0h2M9 12v3m6-3v3"/>')}</div>
      <h2>AI Multiplier</h2>
      <p>The tool that takes your Money Club earnings and multiplies them automatically using compound interest.</p>
      <div class="feature-list">${features.map(([ic,t])=>`<div class="feature">${svg(ic)}<span>${t}</span></div>`).join("")}</div>
      <button class="cta purple" id="continue-offer">CONTINUE ${arrow}</button>
    </section>`;
    document.getElementById("continue-offer").addEventListener("click",()=>{playClickSound();showOffer();});
  }
  function showOffer(){
    const items=['Automatically reinvests your daily profits','Compound interest to multiply earnings','AI-powered risk management','Works 24/7 while you sleep','Priority processing & support'];
    app.innerHTML=`<section class="screen offer">
      <h2>Activate AI Multiplier</h2>
      <p class="offer-sub">Multiply your Money Club earnings automatically with compound interest.</p>
      <div class="price-card">
        <div class="price-tag">AI MULTIPLIER</div>
        <p class="unlock">Unlock the multiplier for:</p>
        <p class="price"><span class="currency">US</span>$197</p>
        <p class="payment">one-time payment</p>
        <ul class="benefits">${items.map(t=>`<li>${check}<span>${t}</span></li>`).join("")}</ul>
        <button class="cta purple" id="buy">ACTIVATE MULTIPLIER ${arrow}</button>
      </div>
      <p class="guarantee">7-day guarantee · One-time payment</p>
      <button class="text-link" id="skip">No, I want to continue without multiplying</button>
      <div class="secure">${svg('<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>')}<span>Secure payment · SSL encrypted</span></div>
    </section>`;
    document.getElementById("buy").addEventListener("click",()=>{playClickSound();setTimeout(()=>window.location.href=BUY_URL,180);});
    document.getElementById("skip").addEventListener("click",()=>{playClickSound();setTimeout(()=>window.location.href=SKIP_URL,180);});
  }
  renderQuestion();
})();
</script>
</body>
</html>
